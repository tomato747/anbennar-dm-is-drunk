 #Assimilation stuff
 paradox_empire_pordox_intarct_g_assimilated:0 "Paradoxical Bullshit"
 paradox_empire_pordox_intarct_g_assimilated_desc:0 "We are the Order of Pordox Intarct, we don't care if things makes no sense and are paradoxical. For as long as our dungeon master is inebriated and open to our nonsense, we shall commit absolute bullshit and break reality! And Halann will kneel and tremble before us!"
 paradox_empire_anbennarian_assimilated:0 "Anbennarian Unity"
 paradox_empire_anbennarian_assimilated_desc:0 "Anbennar means unity, and unity means Anbennar. Our cause too is that of unity — the unity of Surael, each and every person serving His cause and carrying a piece of His Light. With the Anbennarians in our nation, that call for unity shall only be stronger, and every endeavour strengthened thereby."
 paradox_empire_alenic_assimilated:0 "Reachmen Proto-Industrialization"
 paradox_empire_alenic_assimilated_desc:0 "While we were spreading Surael's Light and truth across the Salahad, Bulwar, and Rahen, the Alenic peoples were fighting for their lives against ferocious Gray Orcs — and more importantly, they were developing innovative new forms of manufacturing and production. Now that Surael's Light has risen above their cold shores, we should catch up on what we missed, and make sure to implement their ideas across our realm."
 paradox_empire_businori_assimilated:0 "Businori Resilience"
 paradox_empire_businori_assimilated_desc:0 "While beset by stronger and more numerous peoples on all sides, the Businori identity has remained strong and unique. Their personal stubborness is reflected in the sturdiness of their ships, and we would do well to update our ship-building techniques to echo such designs."
 paradox_empire_escanni_assimilated:0 "Escanni Government Innovation"
 paradox_empire_escanni_assimilated_desc:0 "Following the chaos of the Greentide, Escann has seen the flourishing of new nations, and with them, it has become a hotbed of administrative innovation. While our clean conquest makes clear many of these governments' flaws, we should review their systems and take the best ideas to smooth our own bureaucracy."
 paradox_empire_dostanorian_g_assimilated:0 "Steadfast as a Dostanorian"
 paradox_empire_dostanorian_g_assimilated_desc:0 "Daravan's Folly remains a tragedy to this day, a scar on Halcann. But with so much land forever lost to them, the Dostanorian people hold fast to what remains, refusing to give it up to any invaders. While that was a nuisance in our conquest, from their spirit every man in the Empire can learn to never surrender a position."
 paradox_empire_kheteratan_assimilated:0 "Legacy of the Divenhal"
 paradox_empire_kheteratan_assimilated_desc:0 "The Divenhal was where humans first plied the waves, and the surrounding peoples can trace their sea-voyaging techniques to those days. Now that they are a loyal part of our Empire, they should be persuaded to share those secrets easily enough."
 paradox_empire_lencori_assimilated:0 "Traditions of Knighthood"
 paradox_empire_lencori_assimilated_desc:0 "Where knights speak of Chivalry, we see the same principles that Surael commanded all of us to follow. Now that every Lencori pays fealty to us, it should be no major stretch for some of our cavalry to learn their traditions — and their charges shall be all the more devastating for it."
 paradox_empire_halfling_assimilated:0 "Halfling Connections"
 paradox_empire_halfling_assimilated_desc:0 "The halflings have always known that to achieve their freedom, they would need more than raw might: it demanded their sharpest wits, and leveraging connections and favours they built over decades. Now that they have found the true freedom, that of Surael's Light, we should be able to put those networks to even better use."
 paradox_empire_gnomish_assimilated:0 "Benign Intervention"
 paradox_empire_gnomish_assimilated_desc:0 "Ideally, the gnomes will not even notice that we have conquered them (aside from a mandatory shift in their religious practices). We must make sure their universities, laboratories, and research projects all proceed as before, so we can reap the benefits of their brilliant minds."
 paradox_empire_gerudian_assimilated:0 "Memories of Black Ice"
 paradox_empire_gerudian_assimilated_desc:0 "In the Age of Black Ice, Gerudian reavers stood astride the world, conquering and colonizing as they pleased. Though those days are long since past, and our ascension far outpaces any prior, these newly-conquered peoples will ensure we never forget the importance of naval power."
 paradox_empire_giantkind_assimilated:0 "Gigantic Building Techniques"
 paradox_empire_giantkind_assimilated_desc:0 "What the Giants built, they built to last. The same ideas live on in the peoples who inherited their blood and legacy, and while our buildings will not be on quite the same scale, our architects surely have much to learn from the Giantkind people and buildings that are now part of our domain."
 paradox_empire_elven_assimilated:0 "The Elves Reunified"
 paradox_empire_elven_assimilated_desc:0 "Once, we ruled. Once, we were shattered. Once, we were cast to the waves, lost for a millennium and longer. But those days are behind us now, as under Surael's Light we have created a state to rival even the Precursor Empire. And every elf in our army shall fight fiercer knowing that they are the spearpoint of a reunified people."
 paradox_empire_dwarven_assimilated:0 "Ancient, and Modern, Cannons"
 paradox_empire_dwarven_assimilated_desc:0 "The dwarves have forgotten more about artillery than most other peoples have ever known. Dwarven guns once fought the Precursor Empire to a standstill, and while they could not hold off our righteous forces, we must make sure to learn their techniques and elevate our cannons to the same level."
 paradox_empire_kobold_assimilated:0 "Honouring the Trap-Fallen"
 paradox_empire_kobold_assimilated_desc:0 "No people knows the art of guerilla warfare or the booby trap like the kobolds, and we paid quite the price to learn that truth during the conquest of their lands. We must ensure we study their fiendish mechanisms, so that every drop of blood they spilled is repaid tenfold in the blood of any invaders who intrude into our realm."
 paradox_empire_gnollish_assimilated:0 "Leashed Sociopathy"
 paradox_empire_gnollish_assimilated_desc:0 "Since our days as a Desert Legion, we have tried to educate the gnolls in the basics of ethics. While our success has been limited, we have come to realize their amoral tendencies — on a tight leash — might be helpful in some of our thornier diplomatic negotiations."
 paradox_empire_orcish_assimilated:0 "Orcish Vanguard"
 paradox_empire_orcish_assimilated_desc:0 "What is best in life? The orcs would say it is to crush your enemies, to see them driven before you, and to hear the lamentations of their women. We must make clear to them that in truth, the best is to serve Surael and emulate Him — but until that is done, we may take advantage of their ferocity by using them as shock-troopers."
 paradox_empire_goblin_assimilated:0 "Survival, Against All Odds"
 paradox_empire_goblin_assimilated_desc:0 "In barren cavern. In Hobgoblin slave-chains. In the Greentide's wake. Few races have endured more — or survived worse — than the goblins. Though our days in bleak desert are not too long gone ourselves, we still can learn something from them of survival in even the harshest conditions."
 paradox_empire_bulwari_assimilated:0 "Birthplace of Empires"
 paradox_empire_bulwari_assimilated_desc:0 "Just as for Jaher, our Empire's promise was first illuminated in sun-draped, sun-blessed, Bulwar. Now that it is completely in our grasp, we begin to see that promise fulfilled. Onwards, for Surael!"
 paradox_empire_harpy_assimilated:0 "The Salvation of Jasiéne"
 paradox_empire_harpy_assimilated_desc:0 "When the desert legion was wandering in the East Salahad wastes, it was the harpies who took them under wing, showing them oases and ensuring their survival. Ever since those days, the harpies have been an integral part of the Jadd Empire. They were our salvation, and with the Jadd we became theirs as well; the same is true for our battle-wounded, who might close their eyes to death only to awake to a harpy evacuating them to have their wounds tended."
 paradox_empire_upper_raheni_assimilated:0 "Lessons of the Rahenraj"
 paradox_empire_upper_raheni_assimilated_desc:0 "The Rahenraj fell centuries upon centuries ago, well before the Day of Ashen Skies, but its communication flags and army regulations live on still among the Shamakhadi. We thought this an odd anachronism when we were conquering these lands, but quickly came to understand it meant they could rapidly outfit new armies and merge forces without confusion. Integrating some of these elements into our own command structure should carry similar benefits."
 paradox_empire_middle_raheni_assimilated:0 "Scholar-boats of the Kharunyana"
 paradox_empire_middle_raheni_assimilated_desc:0 "One of the oddest sights as our armies marched into the Dhujati lands were the large boats that floated peacefully down the Kharunyana, aboard which philosophers and other scholars fought battles as vicious as any of ours. We must ensure these boats continue to flow; just as our campaigns have forged a domain dedicated to Surael, out of their conflicts emerge the most extraordinary new ideas."
 paradox_empire_south_raheni_assimilated:0 "The Palace Brigade"
 paradox_empire_south_raheni_assimilated_desc:0 "In our conquest of South Rahen, we were both frustrated and fascinated by the varied palaces we came across that littered the Dhenbasana. They were works of beauty even to our desert-austere eyes, and despite that beauty, they were exceedingly difficult to crack. Now that the region is firmly in our hands, we must gather up the same architects and engineers who built them, to ensure no walls hold back Surael's Light."
 paradox_empire_hobgoblin_assimilated:0 "A Soldiering Heritage"
 paradox_empire_hobgoblin_assimilated_desc:0 "With our roots in Jaddar's Desert Legion, many people of the Jadd Empire have long seen themselves as soldiers first and foremost. But even though The Command has now been burned away by Surael's fire, it is clear even we have something to learn from the hobgoblins about making soldiery core to our being."
 paradox_empire_harimari_assimilated:0 "Sitarayar's Codex"
 paradox_empire_harimari_assimilated_desc:0 "Amongst the many harimari that saw the Light of Jadd in our early days pushing into Rahen, Sitarayar of the Bright Claw shone the brightest. As a general, he was essential in conquering the Harimraj. But after he lost a paw in our crusade against The Command, he turned to scholarship. His tracts on the history and development of Royal Harimari government systems are essential, and the codex which compiles them perhaps his greatest legacy."
 paradox_empire_centaur_assimilated:0 "The Storm, Tamed"
 paradox_empire_centaur_assimilated_desc:0 "The centaurs, long divided, must unite. The centaurs, long united, must divide. So it has been — but now that they have been unified under the banner of the Jadd and the sun of Surael, they shall divide no longer. Instead, their ferocious charges shall make our own all the stronger."
 paradox_empire_ogre_assimilated:0 "Thick Hides"
 paradox_empire_ogre_assimilated_desc:0 "Though the Fathides are the only ogres who make their bulk part of their self-description, every ogre's thick skin helps them shrug off blows and beatings. While Surael's Light of course penetrated even this thickest of barriers, it remains clear that putting ogres on our armies' flanks will ensure we take few casualties, no matter how fierce the fight."
 paradox_empire_triunic_assimilated:0 "Experienced Debaters"
 paradox_empire_triunic_assimilated_desc:0 "Once, the great Assembly Hall of the Lake Federation contained an entire people's debates, as they navigated crises and strove towards greatness. Now that they have seen the Light of Surael, the great Hall has become an even greater temple of The Jadd. That does leave quite a few talented orators and conniving politicians without a space to exercise their talents, and we should make sure they find a suitable place in our diplomatic corps."
 paradox_empire_bom_assimilated:0 "Bim Lau Fort Design"
 paradox_empire_bom_assimilated_desc:0 "The Jadd has known many citadels in its time. From our early conquest of Azka-Sur, to the varied Harpy roosts we surmounted, to the desert-swept walls of Davharral, all fell before us in time. But we have never known a barrier like the walls of Bim Lau, where both living and dead defend with paramount vigour and overwhelming number. While the souls of our dead are left to Surael's care rather than pressed into service on the walls, we should seek to adapt their style to ensure our own forts hold off invaders almost as well."
 paradox_empire_kai_assimilated:0 "The Sunlight Step"
 paradox_empire_kai_assimilated_desc:0 "Our generals laughed when they first saw the strange marching style of the Kai. They quickly grew jealous, once they realized it somehow allowed lightning-fast repositioning of forces, with commensurate strategic and tactical advantages. While the bulk of our forces do not have the marathon experience the Kai do, we must see what can be adapted of their style. Surael's Light travels fast, and our armies must too."
 paradox_empire_kelino_assimilated:0 "Trading Family Co-operation"
 paradox_empire_kelino_assimilated_desc:0 "The Sun Elves of Arawkelin survived the break-up of the Phoenix Empire by cooperating with the local Pagnili tribes, and that legacy lives on in the Kelino families who dominate their commerce still. It is time for the locals to co-operate with Elven conquerors once again, and once they do, all the riches of Haless shall flow into our hands."
 paradox_empire_yanglam_assimilated:0 "A Jungle of Crowns"
 paradox_empire_yanglam_assimilated_desc:0 "In the Yanglamese rainforest, every ruler called themself a king, with accompanying accoutrements and regalia. Now, however, by sword or by pen they have come to realize that Surael is the true King, and the Jadd Empire His state. We are thus left with a surfeit of crowns with no one to wear them; they shall make excellent centerpieces for our assembly rooms and feasthalls, and remind all of our supreme reign."
 paradox_empire_yan_assimilated:0 "An Arsenal of the Three Weapons"
 paradox_empire_yan_assimilated_desc:0 "Since Jaddar and his unceasing arrows led the Desert Legion to victory and ascendence, learning the bow has been an essential component of our soldiers' military education. But every battle — bloody, beautiful, brutal — in the conquest of Yanshen has made clear why these people see utility in learning the spear and jian as well. Our training regime should be updated accordingly."
 paradox_empire_gowon_assimilated:0 "Bow Lords, Old and New"
 paradox_empire_gowon_assimilated_desc:0 "The Jadd began with Jaddar, whose skill with the bow led us to victory in plenty of early battles. In the conquest of Danggun, we were exposed to a new set of bow lords, their Hwalbaek, and we were impressed by the spirit-weapon wielders' skill even as we dreaded the casualties they inflicted. Now that the land is embraced by Surael's Light, we should integrate their archery traditions into our training, and ensure every soldier learns some of their marksmens' abilities."
 paradox_empire_khantaar_assimilated:0 "Terrorbird Outriders"
 paradox_empire_khantaar_assimilated_desc:0 "The Jaddari began on the backs of desert steeds, and as we expanded, we were forced to find breeds better-suited to Rahen's thick jungles or the Deepwood's great forests. Now that — finally — the faceless warriors of the northern steppe have been subjugated, we should integrate terrorbirds as well (where appropriate) into our cavalry. And with their eating habits, as long as we keep fighting battles we should be able to spend significantly less on feed."
 paradox_empire_besholgi_assimilated:0 "To the Furthest Seas"
 paradox_empire_besholgi_assimilated_desc:0 "We found Moduk a cold, harsh, desolate land. But that makes it no less important to Surael than any other, and bringing the Besholgi into His Light is as important for our Lightbringers as any other (ignore any who might describe being sent to Moduk as a punishment). Moreover, setting up fleets for supply to barren lands has taught us a lot about the logistical necessities for action in distant ports — a blessing from Surael that shall undoubtedly serve our trade voyages well."
 paradox_empire_akasi_assimilated:0 "Secured Sarhaly Trade"
 paradox_empire_akasi_assimilated_desc:0 "The Akasi having seen the Light of Jadd has many benefits. First, of course, is that they can now fulfill their Surael-given purpose. Second, that our entire crusade is stronger for their unique role in it. And third -- we can securely trade with and around Sarhal, and every merchant in the Jadd will be richer for it."
 paradox_empire_irsukuba_assimilated:0 "Different Views, One Surael"
 paradox_empire_irsukuba_assimilated_desc:0 "When those within Jaddari first heard of how the teachings of Surael were told within Horashesh, there were calls to burn these heretics. Surael and his prophet Jaddar are taken as part of their own pantheon of heroic figures rather than the one true deity. Yet no one could doubt their belief in His teachings. So long as they follow His will, perhaps we can leave them be. All are equal under Surael's Light, after all."
 paradox_empire_vurebindu_assimilated:0 "Horashesh Bounty"
 paradox_empire_vurebindu_assimilated_desc:0 "Compared to our humble beginnings in the Salahad desert, the food reserves in Horashesh were staggering. Cattle fatter than any we had ever seen. Fields of wheat and beans grown throughout their vast, fertile plains. It will take some time to perfect these farming practices, but this could help feed every hungry child under Surael."
 paradox_empire_vyzemby_assimilated:0 "Sailors of the Summer Isles"
 paradox_empire_vyzemby_assimilated_desc:0 "The Vyzemby of Fahvanosy have a fabled culture of seamanship that, until now, has far outstripped our own. Now, the banner of the Divine-Herald flies proudly from each and every mast. The Vyzemby will serve proudly as sailors under Surael’s Light."
 paradox_empire_mengi_assimilated:0 "Surael in the Sky"
 paradox_empire_mengi_assimilated_desc:0 "Up until now, many Mengi have worshiped a sky god who rules over all that exists above Halann. A misguided faith, but not one that is totally contradictory to the divine truth. Though they require much guidance in order to bring this worship in line with Surael’s doctrine, it remains clear that these once-unenlightened people have glimpsed some small fraction of the Light even before our arrival. Surael’s people find themselves now emboldened in their beliefs, utterly convinced of His truth!"
 paradox_empire_baashidi_assimilated:0 "Knowledge in Surael’s Service"
 paradox_empire_baashidi_assimilated_desc:0 "The Baashidi truth-seekers are impressively knowledgeable scholars. As we find ourselves now poised to dispel the false faith that has long clouded their vision, we followers of the Divine-Herald stand to benefit from the full potential of the Baashidi. From the Jasiir Jadid to the Jasiir Doog, another noble people now stand poised to offer their strength - and intelligence - to Surael’s mission."
 paradox_empire_inyaswarosa_assimilated:0 "The Sister Peoples of Ishyamtumu"
 paradox_empire_inyaswarosa_assimilated_desc:0 "Truly, the Tanizu are a proud people. While many have dismissed them as primal beasts due to their ability to shapeshift, we have come to see them as blessed with a gift from Surael. Now that the Tanizu tribes stand united in the Light of the Divine Herald, we are able to show them a new purpose serving in Surael’s legions."
 paradox_empire_west_sarhaly_assimilated:0 "Sarhaly Loyalty"
 paradox_empire_west_sarhaly_assimilated_desc:0 "The lands of western Sarhal are dominated by the Fangaula. While there are myriad regional identities and peculiarities that have marked each nation that has existed in this region, they are all known for a certain sense of courtly elegance that is coupled with a culture of loyalty. This shall prove advantageous to Surael’s mission."
 paradox_empire_lizardfolk_assimilated:0 "Cold-Blooded Craftsmen"
 paradox_empire_lizardfolk_assimilated_desc:0 "The Lizardfolk are known throughout Sarhal for their industriousness. Many a wandering herald of Surael has wandered into the lands of this ancient people and found themselves humbled by their fine works and sense of design. Their works are now to be created for Surael’s glory; a grand purpose that motivates craftsmen to strive for ever-greater works."
 paradox_empire_wuhyun_assimilated:0 "Men of Honour"
 paradox_empire_wuhyun_assimilated_desc:0 "After generations of Hobgoblin rule, the humans living under The Command gradually integrated into hobgoblin society. Through the education system provided by the Laws of Ninun they adopted hobgoblin language, discipline and sense of honor. This resulted in creation of entirely new cultures, combining the human and hobgoblin customs, into something new and unique. A true blessing of Surael! Their martial prowess will greatly help our mission to spread Surael’s Light."
 paradox_empire_reachman_assimilated:0 "Reach the Northerners"
 paradox_empire_reachman_assimilated_desc:0 "Living in the shadow of one conqueror or another, the petty kingdoms and squabbling cities of the Giant's Grave Sea have bickered over piddling profits for centuries. In recent times, these misguided souls huddled together as 'Reachmen' under the Kingdom of Adshaw, but such old, frayed cultural ties did not guide them to victory. With our arrival, the radiance of the sun illuminates even the frozen north. Now they all live free under the purifying glory of Surael. Their former greed now fuels our prosperity, and their merchants now help us spread His Light ever further."
 paradox_empire_khudi_assimilated:0 "Harmony with the Land"
 paradox_empire_khudi_assimilated_desc:0 "The Khudi's earliest myths tell of their arrival on the shores of Gozengun, and since then they have clearly shown that they have an aptitude for adapting to foreign lands and their novel and undiscovered dangers and boons. Their reliance on geomancy to appease the spirits inhabiting their new homeland has sharpened their eye for the minute variations present in even the most monotonous landscape. This has turned them into skilled scouts capable of traversing terrain impassable to most, and their exceptional skirmishers will allow our forces to dance with ease around the lumbering armies of the Jadd's enemies."
 paradox_empire_tyvorkan_assimilated:0 "Riches of the Northern Pass"
 paradox_empire_tyvorkan_assimilated_desc:0 "The hardy peoples eking out a living in the unforgiving frozen lands of the Northern Pass know the importance of community and of sacrificing for the greater good. After the Greytide forced them from their ancestral homes into the vast wilderness of the Northern Pass, it was only their ingenuity and relentless perseverance that prevented their extinction. They know every hidden treasure of the far north and all trade paths traversing this rugged land. Under the light of the Jadd, they have found a new calling as prolific traders providing the southern lands with the bounty of the north."
 paradox_empire_anakue_assimilated:0 "The Call of the Waves"
 paradox_empire_anakue_assimilated_desc:0 "The Anakue are natural sailors, heeding the call of the waves from the moment of their birth. Connecting the many islands of their homeland across the waves has always been an essential part of their culture, and it is thus little wonder that many among them can now be found crewing the many vessels sailing under the banner of the Jadd, their mistcadence songs carrying across the waves."
 paradox_empire_mechanim_assimilated:0 "Tireless Devotion"
 paradox_empire_mechanim_assimilated_desc:0 "The Mechanim are truly unique amongst the diverse inhabitants of Halann, in that they are not born but were made. Yet as Jaddar taught us, all creatures can be the light, and it was this unconditional acceptance of their existence that turned the Mechanim into some of the most fervent followers of the Jadd. Eager to do their part in the Struggle, they thus work tirelessly, as unlike their organic compatriots they do not require rest."
 paradox_empire_tagaala_assimilated:0 "Intrepid Explorers"
 paradox_empire_tagaala_assimilated_desc:0 "The inhabitants of the Mangrove Coast of Insyaa have always shown exceptional courage and daring, whether by mastering the Titanomangroves of their home or sailing far into the unknown in search of new discoveries and trading partners, such as their long-lost ancestral homeland of Kanolowele. This proud tradition has seen many Taga’ala joining the navy and swiftly climbing its ranks, spreading the word of Surael wherever the winds take them."
 paradox_empire_utubodi_assimilated:0 "The Greater Whole"
 paradox_empire_utubodi_assimilated_desc:0 "The Utubodi inhabitants of the central plateau of Insyaa have always demonstrated a remarkable grasp of the fact that all sentients are linked to each other. The spark of divine essence, or Ilu, of Surael which resides in the core of their being connects all sentients. Even before the teachings of the Jadd reached them, their native faith espoused a fragmentary version of this truth. Now, the Utubodi consider it their most sacred duty to remind the faithful that all are part of a greater whole and that to harm another means harming one’s self."
 paradox_empire_yanacotle_assimilated:0 "Glowing Guns"
 paradox_empire_yanacotle_assimilated_desc:0 "The fiery volcanoes of the Yanacotle home isles have inspired their inhabitants to emulate the awe-inspiring destructive force of lava, first by mastering fire magic and developing the first firearms seen in Insyaa, then by merging these two skills to create cannons and muskets imbued with the power of earth’s inner fire. Now that they have joined the ranks of the faithful, their unique techniques serve to strengthen our armies."
 paradox_empire_yenbenmirra_assimilated:0 "Masters of the Arcane Currents"
 paradox_empire_yenbenmirra_assimilated_desc:0 "It is said that magic runs in the blood of the Yenbenmirra, who for several millennia have shaped their environment with their fire magic, preventing incursions of Titanoflora and -fauna. What once was thought a gift of their goddess is now understood as the blazing blessing of Surael. With their innate understanding of the natural ebb and flow of magical energy, they have been invaluable in teaching our magi to properly harness the ambient magic all around us."
 jadd_empire_pordox_intarct_g_assimilated:0 "Paradoxical Bullshit"
 jadd_empire_pordox_intarct_g_assimilated_desc:0 "We are the Order of Pordox Intarct, we don't care if things makes no sense and are paradoxical. For as long as our dungeon master is inebriated and open to our nonsense, we shall commit absolute bullshit and break reality! And Halann will kneel and tremble before us!"